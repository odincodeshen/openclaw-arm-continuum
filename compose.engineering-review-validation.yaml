services:
  review-router:
    image: nvcr.io/nvidia/vllm:26.03.post1-py3
    container_name: openclaw-review-router
    ipc: host
    gpus: all
    ports:
      - "127.0.0.1:18001:8000"
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
      - ${VLLM_CACHE_DIR:-./.cache/vllm}:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - bash
      - -lc
      - >
        vllm serve ${OPENCLAW_ROUTER_MODEL:-Qwen/Qwen3-0.6B}
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization ${OPENCLAW_ROUTER_GPU_MEMORY_UTILIZATION:-0.06}
        --max-model-len ${OPENCLAW_ROUTER_MAX_MODEL_LEN:-4096}
        --max-num-seqs 1
        --trust-remote-code
        --enforce-eager
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: "no"

  review-coder:
    image: nvcr.io/nvidia/vllm:26.03.post1-py3
    container_name: openclaw-review-coder
    ipc: host
    gpus: all
    ports:
      - "127.0.0.1:18002:8000"
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
      - ${VLLM_CACHE_DIR:-./.cache/vllm}:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - bash
      - -lc
      - >
        vllm serve ${OPENCLAW_CODER_MODEL:-Qwen/Qwen2.5-Coder-7B-Instruct}
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization ${OPENCLAW_CODER_GPU_MEMORY_UTILIZATION:-0.18}
        --max-model-len ${OPENCLAW_CODER_MAX_MODEL_LEN:-8192}
        --max-num-seqs 1
        --trust-remote-code
        --enforce-eager
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 120s
    restart: "no"

  review-reasoner:
    image: nvcr.io/nvidia/vllm:26.03.post1-py3
    container_name: openclaw-review-reasoner
    ipc: host
    gpus: all
    ports:
      - "127.0.0.1:18003:8000"
    volumes:
      - ${HF_CACHE_DIR:-./.cache/huggingface}:/root/.cache/huggingface
      - ${VLLM_CACHE_DIR:-./.cache/vllm}:/root/.cache/vllm
    environment:
      HF_HOME: /root/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command:
      - bash
      - -lc
      - >
        vllm serve ${OPENCLAW_REASONER_MODEL:-Qwen/Qwen3.6-27B-FP8}
        --host 0.0.0.0
        --port 8000
        --gpu-memory-utilization ${OPENCLAW_REASONER_GPU_MEMORY_UTILIZATION:-0.45}
        --max-model-len ${OPENCLAW_REASONER_MAX_MODEL_LEN:-16384}
        --max-num-seqs 1
        --trust-remote-code
        --reasoning-parser qwen3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 120s
    restart: "no"
