# Any other NVIDIA GPU host. Loose limits; add a profile for your machine.
name = "nvidia-gpu"
description = "another NVIDIA GPU host"
priority = 10

[match]
gpu = "NVIDIA"

[run]
long_prompt_tokens = 8000

[thresholds]
generation_tokens_per_s_min = 5
prompt_tokens_per_s_min = 200
long_prompt_seconds_max = 120
vision_seconds_max = 120
embedding_ms_max = 2000
