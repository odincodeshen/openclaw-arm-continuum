name: work log -- add from Telegram, a full day, next morning and follow-up
clock: "2026-10-01T17:55"
steps:
  - say: /checkins add worklog
    expect: {contains: ["Added 收工紀錄 (/worklog)"]}
  - clock: "2026-10-01T18:00"
    tick: true
    expect: {contains: ["【收工紀錄 1/3】"], buttons: ["Skip today"]}
  - say: "Wrote the sample spec"
    expect: {contains: ["【收工紀錄 2/3】"]}
  - say: "none"
  - say: "Review the sample PR"
    expect: {contains: ["【今日收工】"], buttons: ["Add to tomorrow's schedule"]}
  - clock: "2026-10-02T07:01"
    tick: true
    expect: {contains: ["【今天的第一件事】", "Review the sample PR"]}
  - clock: "2026-10-02T18:00"
    tick: true
    expect: {contains: ["Did you start with it?"], buttons: ["Done", "Skip today"]}
  - tap: "Done"
    expect: {contains: ["【收工紀錄 1/3】"]}
  - say: "/worklog"
    expect: {contains: ["Thu 1 ✅"]}
